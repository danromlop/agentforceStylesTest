  <script type="text/javascript">
    function initEmbeddedMessaging() {
      try {
        window.addEventListener("onEmbeddedMessagingReady", () => {
          embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            Username: "AjOsStvRtltVhNMpKE/uOud2RmbOwSgeWoBhz4i7K04="

        });

        embeddedservice_bootstrap.settings.language = "en-US";
        embeddedservice_bootstrap.settings.displayMode = "inline";
        embeddedservice_bootstrap.settings.targetElement = document.getElementById("embedded-messaging");

        embeddedservice_bootstrap.init(
          "00DS800000H2hIP",
          "Z_EC_esd_ChatMessagingChannelDeployment",
          "https://esadeus--ecdessandb.sandbox.my.site.com/ESWZECesdChatMessaging1779292885847",
          {
            scrt2URL:
              "https://esadeus--ecdessandb.sandbox.my.salesforce-scrt.com"
          }
        );
      } catch (err) {
        console.error("Error loading Embedded Messaging:", err);
      }

  <script
    type="text/javascript"
